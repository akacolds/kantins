<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kantin Online</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Pengubah Tema Global -->
    <div class="theme-picker" title="Ubah Warna Tema">
        🎨 <input type="color" id="theme-color" onchange="ubahTema(this.value)">
    </div>

    <!-- HALAMAN LOGIN (Gabung 1 Pintu) -->
    <div id="login-view" class="container">
        <div class="card">
            <h2>Masuk E-Kantin</h2>
            <p class="text-muted">User baru otomatis terdaftar sebagai pembeli.</p>
            <input type="text" id="login-user" placeholder="Username (cth: admin, kantin, andi)">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="login()">Masuk / Daftar</button>
        </div>
    </div>

    <!-- DASHBOARD PEMBELI -->
    <div id="pembeli-view" class="container hidden">
        <div class="card header-flex">
            <div class="pfp-container">
                <img id="pembeli-pfp" src="https://ui-avatars.com/api/?name=User" alt="PFP" onclick="document.getElementById('upload-pfp').click()">
                <input type="file" id="upload-pfp" hidden accept="image/*" onchange="ubahPfp(event)">
                <h3 id="pembeli-name">Halo, Pembeli!</h3>
            </div>
            <button class="btn-danger" onclick="logout()" style="width:auto">Keluar</button>
        </div>

        <div class="card">
            <h3>Menu Makanan</h3>
            <div id="katalog-menu"></div> <!-- Menu dirender dari JS -->
        </div>

        <div class="card">
            <h3>Chat Kantin</h3>
            <div class="chat-box" id="chat-pembeli"></div>
            <div class="flex">
                <input type="text" id="chat-input-pembeli" placeholder="Tanya kantin...">
                <button onclick="kirimChat('pembeli')" style="width: 80px;">Kirim</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD KANTIN -->
    <div id="kantin-view" class="container hidden">
        <div class="banner" id="kantin-banner">
            <div class="banner-overlay">
                <h2>Dashboard Kantin</h2>
                <div class="flex">
                    <button class="btn-alt" onclick="document.getElementById('upload-banner').click()">Ubah Banner</button>
                    <input type="file" id="upload-banner" hidden accept="image/*" onchange="ubahBanner(event)">
                    <button class="btn-danger" onclick="logout()">Keluar</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Tambah Menu</h3>
            <input type="text" id="input-nama" placeholder="Nama Menu">
            <input type="number" id="input-harga" placeholder="Harga (Rp)">
            <input type="text" id="input-varian" placeholder="Varian (Pisah koma, cth: Pedas,Manis)">
            <input type="number" id="input-stok" placeholder="Stok Awal">
            <button onclick="tambahMenu()">Simpan Menu</button>
        </div>

        <div class="card">
            <h3>Kelola Stok</h3>
            <div id="list-stok"></div> <!-- Stok dirender dari JS -->
        </div>

        <div class="card">
            <h3>Chat Pelanggan</h3>
            <div class="chat-box" id="chat-kantin"></div>
            <div class="flex">
                <input type="text" id="chat-input-kantin" placeholder="Balas pelanggan...">
                <button onclick="kirimChat('kantin')" style="width: 80px;">Kirim</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="admin-view" class="container hidden">
        <div class="card header-flex">
            <h2>Admin Pusat</h2>
            <button class="btn-danger" onclick="logout()" style="width:auto">Keluar</button>
        </div>
        <div class="card">
            <p>Seluruh log transaksi kantin dan user dikelola di sini.</p>
        </div>
    </div>

</body>
</html>
